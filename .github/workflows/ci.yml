# Company: EonHive Inc. | Title: Core verification
# Purpose: Build and test the independent library on supported Node runtimes.
# Author: Stan Nesi | Created: 2026-10-30 | Updated: 2026-10-30
# Notes: Vibe coded with Codex.
name: Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
